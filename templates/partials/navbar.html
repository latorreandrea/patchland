{% comment %}
  Patchland — responsive navigation (Alpine.js).
  Mobile (< md): floating glassmorphism tab bar with a notched animated indicator.
  Desktop (≥ md): floating pill header with logo, text links and primary CTA.
{% endcomment %}
<div
  x-data="navbar({
    initial: '{{ active_nav|default:'home' }}',
    links: [
      { id: 'home', label: 'Home', href: '{% url "home:index" %}' },
      { id: 'map', label: 'Map', href: '{% url "home:map" %}' },
      { id: 'register', label: 'Found a Patch', href: '{% url "home:register" %}' },
      { id: 'passport', label: 'Passport', href: '{% url "home:passport" %}' },
      { id: 'profile', label: 'Profile', href: '{% url "home:profile" %}' },
    ]
  })"
  x-cloak>

  <!-- ============ Mobile: floating bottom tab bar ============ -->
  <nav class="fixed bottom-4 left-4 right-4 z-50 md:hidden" aria-label="Primary navigation">
    <div class="relative mx-auto max-w-md rounded-2xl border border-ink/10 bg-parchment/90 p-2 shadow-xl shadow-ink/10 backdrop-blur-md">
      <div class="relative flex items-center">
        <!-- Notched animated indicator -->
        <div
          id="indicator"
          class="tab-indicator"
          :style="'width:' + offset + 'px;' + indicatorStyle()"
          aria-hidden="true"></div>

        <template x-for="(link, index) in links" :key="link.id">
          <a
            :href="link.href"
            :aria-label="link.label"
            @click="activeLink = index"
            class="nav-cell group relative z-10 flex h-12 flex-1 select-none items-center justify-center outline-none"
            :class="index === 2 ? '-translate-y-4' : ''">

            <span
              class="relative grid size-12 place-items-center transition-all duration-300"
              :class="index === 2
                ? (activeLink === index
                    ? 'rounded-full bg-brass-400 shadow-lg shadow-brass-500/40 ring-4 ring-brass-300/50'
                    : 'rounded-full bg-forest-800 shadow-lg shadow-ink/20 ring-2 ring-brass-400/70')
                : ''">

              <!-- Inactive (stroke / outline) -->
              <svg
                :class="[
                  activeLink === index ? 'pointer-events-none opacity-0' : 'pointer-events-auto opacity-100 group-hover:opacity-40',
                  index === 2 ? 'text-brass-300' : 'text-ink/45'
                ]"
                class="col-start-1 row-start-1 size-6 transition-opacity duration-300"
                fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
                x-html="link.icon.inactive"></svg>

              <!-- Active (fill / solid) -->
              <svg
                :class="activeLink === index ? 'pointer-events-auto opacity-100' : 'pointer-events-none opacity-0'"
                class="col-start-1 row-start-1 size-6 text-forest-950 transition-opacity duration-300"
                fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"
                x-html="link.icon.active"></svg>
            </span>
          </a>
        </template>
      </div>
    </div>
  </nav>

  <!-- ============ Desktop: floating top header ============ -->
  <header
    class="fixed left-1/2 top-4 z-50 hidden -translate-x-1/2 items-center gap-6 rounded-full border border-ink/10 bg-parchment/90 px-6 py-3 shadow-lg shadow-ink/5 backdrop-blur-md md:flex"
    aria-label="Primary navigation">
    <!-- Brand -->
    <a href="{% url 'home:index' %}" class="flex items-center gap-3">
      <span class="relative grid size-9 place-items-center" aria-hidden="true">
        <span class="absolute inset-0 animate-spin-slow rounded-full border border-dashed border-brass-500/70"></span>
        <span class="font-display text-lg font-bold text-brass-600">P</span>
      </span>
      <span class="flex flex-col leading-none">
        <span class="font-display text-lg tracking-wide text-forest-900">Patchland</span>
        <span class="font-display text-xs italic text-brass-600">Res Publica Mundi</span>
      </span>
    </a>

    <!-- Center links -->
    <nav class="flex items-center gap-1" aria-label="Desktop navigation">
      <template x-for="link in links.filter((l) => l.id !== 'register')" :key="link.id">
        <a
          :href="link.href"
          @click="activate(link)"
          class="group flex items-center gap-1.5 rounded-full px-3 py-1.5 text-sm font-medium transition-colors duration-300"
          :class="activeId === link.id ? 'bg-forest-100 text-forest-900' : 'text-ink-soft hover:text-forest-800'">
          <span class="relative grid size-4 place-items-center">
            <!-- Inactive (stroke / outline) -->
            <svg
              :class="activeId === link.id ? 'pointer-events-none opacity-0' : 'pointer-events-auto opacity-100 group-hover:opacity-40'"
              class="col-start-1 row-start-1 size-4 transition-opacity duration-300"
              fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
              x-html="link.icon.inactive"></svg>
            <!-- Active (fill / solid) -->
            <svg
              :class="activeId === link.id ? 'pointer-events-auto opacity-100' : 'pointer-events-none opacity-0'"
              class="col-start-1 row-start-1 size-4 transition-opacity duration-300"
              fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"
              x-html="link.icon.active"></svg>
          </span>
          <span x-text="link.label"></span>
        </a>
      </template>
    </nav>

    <!-- Primary CTA -->
    <a
      href="{% url 'home:register' %}"
      class="inline-flex items-center gap-2 rounded-full bg-forest-800 px-5 py-2 text-sm font-semibold text-brass-300 shadow-md transition-all duration-300 hover:-translate-y-0.5 hover:bg-forest-700">
      <svg class="size-4" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path fill-rule="evenodd" clip-rule="evenodd" d="M12 3.75C12.4142 3.75 12.75 4.08579 12.75 4.5V11.25H19.5C19.9142 11.25 20.25 11.5858 20.25 12C20.25 12.4142 19.9142 12.75 19.5 12.75H12.75V19.5C12.75 19.9142 12.4142 20.25 12 20.25C11.5858 20.25 11.25 19.9142 11.25 19.5V12.75H4.5C4.08579 12.75 3.75 12.4142 3.75 12C3.75 11.5858 4.08579 11.25 4.5 11.25H11.25V4.5C11.25 4.08579 11.5858 3.75 12 3.75Z"/>
      </svg>
      Found a Patch
    </a>
  </header>
</div>

      active: '<path fill-rule="evenodd" clip-rule="evenodd" d="M8.16147 2.58076C8.68934 2.31683 9.31066 2.31683 9.83853 2.58076L14.8323 5.07765C14.9379 5.13043 15.0621 5.13043 15.1677 5.07765L19.0365 3.14326C20.2832 2.51992 21.75 3.42647 21.75 4.82031V17.3047C21.75 18.0149 21.3487 18.6642 20.7135 18.9818L15.8385 21.4193C15.3107 21.6832 14.6893 21.6832 14.1615 21.4193L9.16771 18.9224C9.06213 18.8696 8.93787 18.8696 8.8323 18.9224L4.96353 20.8568C3.71683 21.4801 2.25 20.5736 2.25 19.1797V6.69531C2.25 5.98512 2.65125 5.33587 3.28647 5.01826L8.16147 2.58076ZM9 6.00002C9.41421 6.00002 9.75 6.3358 9.75 6.75002V15C9.75 15.4142 9.41421 15.75 9 15.75C8.58579 15.75 8.25 15.4142 8.25 15V6.75002C8.25 6.3358 8.58579 6.00002 9 6.00002ZM15.75 9.00002C15.75 8.5858 15.4142 8.25002 15 8.25002C14.5858 8.25002 14.25 8.5858 14.25 9.00002V17.25C14.25 17.6642 14.5858 18 15 18C15.4142 18 15.75 17.6642 15.75 17.25V9.00002Z"/>'
    },
    register: {
      inactive: '<path d="M12 4.5V19.5M19.5 12L4.5 12"/>',
      active: '<path fill-rule="evenodd" clip-rule="evenodd" d="M12 3.75C12.4142 3.75 12.75 4.08579 12.75 4.5V11.25H19.5C19.9142 11.25 20.25 11.5858 20.25 12C20.25 12.4142 19.9142 12.75 19.5 12.75H12.75V19.5C12.75 19.9142 12.4142 20.25 12 20.25C11.5858 20.25 11.25 19.9142 11.25 19.5V12.75H4.5C4.08579 12.75 3.75 12.4142 3.75 12C3.75 11.5858 4.08579 11.25 4.5 11.25H11.25V4.5C11.25 4.08579 11.5858 3.75 12 3.75Z"/>'
    },
    passport: {
      inactive: '<path d="M12 6.04168C10.4077 4.61656 8.30506 3.75 6 3.75C4.94809 3.75 3.93834 3.93046 3 4.26212V18.5121C3.93834 18.1805 4.94809 18 6 18C8.30506 18 10.4077 18.8666 12 20.2917M12 6.04168C13.5923 4.61656 15.6949 3.75 18 3.75C19.0519 3.75 20.0617 3.93046 21 4.26212V18.5121C20.0617 18.1805 19.0519 18 18 18C15.6949 18 13.5923 18.8666 12 20.2917M12 6.04168V20.2917"/>',

    },
    profile: {
      inactive: '<path d="M17.9815 18.7248C16.6121 16.9175 14.4424 15.75 12 15.75C9.55761 15.75 7.38789 16.9175 6.01846 18.7248M17.9815 18.7248C19.8335 17.0763 21 14.6744 21 12C21 7.02944 16.9706 3 12 3C7.02944 3 3 7.02944 3 12C3 14.6744 4.1665 17.0763 6.01846 18.7248M17.9815 18.7248C16.3915 20.1401 14.2962 21 12 21C9.70383 21 7.60851 20.1401 6.01846 18.7248M15 9.75C15 11.4069 13.6569 12.75 12 12.75C10.3431 12.75 9 11.4069 9 9.75C9 8.09315 10.3431 6.75 12 6.75C13.6569 6.75 15 8.09315 15 9.75Z"/>',

    }
  };
  Alpine.data('navbar', (config = {}) => ({
    activeLink: 0,
    offset: 64,
    initial: config.initial || 'home',
    links: [],

    init() {
      this.links = (config.links || []).map((link) => ({
        id: link.id,
        label: link.label,
        href: link.href,
        icon: ICONS[link.id] || { inactive: '', active: '' },
      }));

      const idx = this.links.findIndex((link) => link.id === this.initial);
      this.activeLink = idx >= 0 ? idx : 0;

      this.$nextTick(() => this.measure());
      window.addEventListener('resize', () => this.measure());
    },

    get activeId() {
      return this.links[this.activeLink] ? this.links[this.activeLink].id : 'home';
    },

    activate(link) {
      const idx = this.links.findIndex((l) => l.id === link.id);
      if (idx >= 0) this.activeLink = idx;
    },

    measure() {
      const cell = this.$root.querySelector('.nav-cell');
      if (cell) this.offset = cell.getBoundingClientRect().width;
    },

    indicatorStyle() {
      return 'transform: translateX(' + (this.offset * this.activeLink) + 'px)';
    },
  }));

</script>
