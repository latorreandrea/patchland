{% comment %}
  Patchland — top navigation.
  Asymmetric header: compass-rose monogram, live status indicator and a
  diagonal cut on the bottom-right edge.
{% endcomment %}
<header class="relative z-50">
  <nav class="relative overflow-hidden bg-forest-900 pb-10 text-parchment-100 [clip-path:polygon(0_0,100%_0,100%_calc(100%-1.5rem),0_100%)]">
    <!-- Decorative blurred blobs behind the nav content -->
    <div class="blob -left-16 -top-16 size-48 bg-brass-500/30" aria-hidden="true"></div>
    <div class="blob -right-12 -top-24 size-56 bg-forest-500/40" aria-hidden="true"></div>

    <div class="content-container relative flex flex-wrap items-center justify-between gap-y-3 py-4">
      <!-- Brand -->
      <a href="{% url 'home:index' %}" class="group flex items-center gap-3">
        <span class="relative grid size-11 place-items-center" aria-hidden="true">
          <span class="absolute inset-0 animate-spin-slow rounded-full border border-dashed border-brass-400/70"></span>
          <span class="absolute inset-0.5 rounded-full border border-brass-400/20"></span>
          <span class="font-display text-xl font-bold text-brass-300">P</span>
        </span>
        <span class="flex flex-col leading-none">
          <span class="font-display text-2xl tracking-wide text-parchment-100">Patchland</span>
          <span class="hidden font-display text-sm italic text-brass-300/80 md:inline">Res Publica Mundi</span>
        </span>
      </a>

      <!-- Status badge + navigation -->
      <div class="flex items-center gap-5">
        <span class="hidden items-center gap-2 rounded-tl-lg rounded-br-lg rounded-tr-sm rounded-bl-sm border border-brass-400/30 bg-brass-400/10 px-3 py-1.5 text-xs font-medium text-brass-200 sm:inline-flex">
          <span class="relative flex size-2" aria-hidden="true">
            <span class="absolute inline-flex size-full animate-ping rounded-full bg-brass-300 opacity-75"></span>
            <span class="relative inline-flex size-2 rounded-full bg-brass-300"></span>
          </span>
          Nation online
        </span>

        <ul class="flex min-w-0 flex-wrap items-center justify-end gap-x-4 text-sm font-medium sm:gap-x-6">
          <li>
            <a href="{% url 'home:index' %}" class="nav-link group relative inline-block py-1">
              Home
              <span class="absolute inset-x-0 bottom-0 h-px origin-left scale-x-0 bg-brass-400 transition-transform duration-300 group-hover:scale-x-100" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="{% url 'home:manifesto' %}" class="nav-link group relative inline-block py-1">
              Manifesto
              <span class="absolute inset-x-0 bottom-0 h-px origin-left scale-x-0 bg-brass-400 transition-transform duration-300 group-hover:scale-x-100" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="{% url 'home:index' %}#statistics" class="nav-link group relative inline-block py-1">
              Statistics
              <span class="absolute inset-x-0 bottom-0 h-px origin-left scale-x-0 bg-brass-400 transition-transform duration-300 group-hover:scale-x-100" aria-hidden="true"></span>
            </a>
          </li>
          <li>
            <a href="/api/docs" target="_blank" rel="noopener" class="nav-link group relative inline-block py-1">
              API
              <span class="absolute inset-x-0 bottom-0 h-px origin-left scale-x-0 bg-brass-400 transition-transform duration-300 group-hover:scale-x-100" aria-hidden="true"></span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
